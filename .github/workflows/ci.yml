name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, RLS suite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests alembic scripts
      - name: Guard against f-string SQL and unscoped cache usage
        run: python backend/scripts/check_sql_fstrings.py
      - name: Run tests (unit + integration + RLS isolation)
        working-directory: backend
        # Coverage floor prevents regression (currently ~67%; the uncovered
        # remainder is live LLM/Qdrant/storage network paths, faked in tests).
        # Ratchet toward 80% as fake-backed coverage of those paths lands.
        run: pytest -q --tb=short --cov=app --cov-fail-under=65

  migrations:
    name: Migration up/down check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Upgrade from empty to head
        working-directory: backend
        run: alembic upgrade head
      - name: Downgrade one revision and re-upgrade
        working-directory: backend
        run: |
          alembic downgrade -1
          alembic upgrade head
      - name: Full downgrade to base and re-upgrade (reversibility drill)
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright vs mock API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox
      - name: Run E2E suite (chromium + tablet + firefox, mock API)
        working-directory: frontend
        run: npx playwright test --project=chromium --project=tablet-chromium --project=firefox
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend dependencies)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict || {
            echo "::warning::pip-audit found vulnerable dependencies"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (high+, with explicit allowlist)
        # next@14's EOL advisories are only fixed by the breaking next@16
        # upgrade; scripts/check-audit.mjs allowlists exactly those so any NEW
        # high/critical advisory still fails the build.
        working-directory: frontend
        run: node scripts/check-audit.mjs
