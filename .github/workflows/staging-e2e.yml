name: Staging E2E (authenticated)

# Nightly authenticated run against staging: exercises the real Supabase login
# path that the PR suite (mock API, demo auth) skips. Requires repo secrets:
#   STAGING_APP_URL, STAGING_API_URL, STAGING_SUPABASE_URL,
#   STAGING_SUPABASE_ANON_KEY, E2E_EMAIL, E2E_PASSWORD

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

jobs:
  e2e-staging:
    runs-on: ubuntu-latest
    # Skip silently until the staging environment secrets are configured.
    if: ${{ vars.STAGING_E2E_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run authenticated suite against staging
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_APP_URL }}
          PLAYWRIGHT_API_URL: ${{ secrets.STAGING_API_URL }}
          E2E_SKIP_WEBSERVER: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: staging-e2e-report
          path: frontend/playwright-report/
          retention-days: 14
