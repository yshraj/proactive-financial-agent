# KritiFin stack: FastAPI backend + Next.js frontend, fronted by Caddy.
#
# Postgres (Supabase) and Qdrant (Qdrant Cloud) are BOTH external managed
# services — set DATABASE_URL, QDRANT_URL and QDRANT_API_KEY in .env. Secrets
# come from .env (see .env.production.example); never hardcode them here.
#
# Host ports are bound to 127.0.0.1 only — the Caddy reverse proxy is the public
# entry point (profile "proxy"). Run the public stack with:
#     docker compose --profile proxy up -d --build
# Plain `docker compose up` (no profile) runs backend+frontend only, with their
# ports on localhost — handy for a local bring-up without a domain/TLS.

name: kritifin

services:
  # Public HTTPS entry point. Routes / -> frontend, /api|/health -> backend, with
  # automatic TLS from Let's Encrypt for $DOMAIN. Only runs with --profile proxy.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    # DATABASE_URL, QDRANT_URL, QDRANT_API_KEY, OPENAI_API_KEY, etc. come from
    # .env (external managed services). Only topology-specific values here.
    environment:
      INLINE_WORKER: "true"     # web process also drains the durable job queue
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* are inlined at build time. Default suits proxy-less local
        # compose (browser -> backend on localhost:8000). Behind the proxy, set
        # NEXT_PUBLIC_API_URL to the public https://DOMAIN in .env (same-origin).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  caddy_data:
  caddy_config:
